<nz-table
  #nzTable
  [nzSize]="'small'"
  [nzData]="groups"
  [nzTotal]="total"
  [nzLoading]="loading"
  [nzShowSizeChanger]="true"
  [nzShowPagination]="true"
  [nzFrontPagination]="!canFilterOnServer"
  (nzQueryParams)="onQueryParamsChange($event)"
>
  <thead>
    <tr>
      @if (selectable && !disabled) {
      <th [nzChecked]="checked" [nzIndeterminate]="indeterminate" (nzCheckedChange)="onAllChecked($event)"></th>
      } @for (column of columns; track column.key) {
      <th
        [nzColumnKey]="column.key"
        [(nzSortOrder)]="column.sortOrder!"
        [nzSortFn]="column.sortFn!"
        [nzFilters]="column.listOfFilter!"
        [nzFilterFn]="column.filterFn!"
        [nzFilterMultiple]="column.filterMultiple!"
      >
        {{ column.name }}
      </th>
      }
    </tr>
  </thead>
  <tbody>
    @for (group of nzTable.data; track group) {
    <tr>
      @if (selectable && !disabled) {
      <td [nzChecked]="selection.has(group.id)" (nzCheckedChange)="onItemChecked(group.id, $event)"></td>
      }
      <td>
        <user-avatar #avatar [group]="group" (openGroupDetails)="openDetails.next($event)" />
      </td>
      <td>{{ group.createdAt | date }}</td>
    </tr>
    }
  </tbody>
</nz-table>
