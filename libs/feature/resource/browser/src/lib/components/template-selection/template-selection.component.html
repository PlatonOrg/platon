<div id="tuto-template-selection-container" class="template-selection-container">
  <div class="header">
    <h2>Choisir un modèle d'exercice</h2>
    <p class="subtitle">Personnalisez votre exercice après avoir sélectionné un modèle.</p>
  </div>

  <div id="tuto-template-grid" class="templates-grid">
    @for (template of templates; track template.id; let index = $index) {
    <resource-template-card
      [id]="index === 0 ? 'tuto-template-card-first' : null"
      [template]="template"
      [style.animation-delay]="index * 0.1 + 0.1 + 's'"
      (templateSelected)="selectTemplate($event)"
    />
    }
  </div>
</div>
