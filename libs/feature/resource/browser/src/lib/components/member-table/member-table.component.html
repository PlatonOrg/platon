<nz-table #nzTable nzSize="small" [nzData]="members">
  <thead>
    <tr>
      <th>Utilisateur</th>
      <th>Date d'ajout</th>
      @if (canDelete || canAccept) {
      <th></th>
      }
    </tr>
  </thead>
  <tbody>
    @for (data of nzTable.data; track data) {
    <tr>
      <td>
        <user-avatar #avatar [userIdOrName]="data.userId" />
      </td>
      <td>{{ data.createdAt | date }}</td>
      @if ((canDelete && !excludeFromDelete.includes(data.userId)) || canAccept) {
      <td nzAlign="center">
        <div nz-flex nzGap="small">
          @if (canAccept) {
          <button nz-button nzType="primary" nzOkText="Accepter" (click)="accept.emit(data)">
            <nz-icon nzType="check-circle" />
          </button>
          } @if (canDelete) {
          <button
            nz-button
            nzDanger
            nzType="primary"
            nz-popconfirm
            [nzOkText]="!data.waiting ? 'Retirer' : 'Refuser'"
            nzOkType="danger"
            [nzPopconfirmTitle]="
              !data.waiting
                ? 'Voulez-vous vraiment retirer “' + avatar.displayName + '” des membres du cercle ?'
                : 'Voulez-vous vraiment refuser la requête de ' + avatar.displayName
            "
            (nzOnConfirm)="deleted.emit(data)"
          >
            <nz-icon nzType="delete" />
          </button>
          }
        </div>
      </td>
      }
    </tr>
    }
  </tbody>
</nz-table>
