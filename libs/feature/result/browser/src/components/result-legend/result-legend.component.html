<nz-list nzSize="small" nzHeader="Légende">
  @for (state of answerStates; track state) {
  <nz-list-item>
    <mat-icon [nz-tooltip]="state | answerStateLabel" [style.color]="state | answerStateColor">
      {{ state | answerStateIcon }}
    </mat-icon>
    <span nz-typography>
      {{ state | answerStateLabel }}
    </span>
  </nz-list-item>
  }
</nz-list>
