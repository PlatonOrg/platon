<div>
  <ul
    cdkDropList
    [class.disabled]="state.disabled"
    [cdkDropListDisabled]="state.disabled"
    [cdkDropListData]="state.items"
    (cdkDropListDropped)="drop($event)"
  >
    @for (item of state.items; track trackBy($index, item)) {
    <li
      cdkDrag
      [ngClass]="getHorizontal() + item.css | css : 'class'"
      [ngStyle]="getHorizontal() + item.css | css : 'style'"
    >
      <nge-markdown [data]="item.content"></nge-markdown>
      <mat-icon>reorder</mat-icon>
    </li>
    }
  </ul>
  <mat-icon>swap_vert</mat-icon>
</div>
<wc-base [(state)]="state"></wc-base>
