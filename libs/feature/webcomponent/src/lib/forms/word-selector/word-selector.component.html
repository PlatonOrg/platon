<nz-card cdkDropListGroup style="width: 100%" [nzBordered]="true">
  <div nz-row nzJustify="center">
    <div nz-col [nzSpan]="24" [nzXs]="24" [nzSm]="12">
      <div
        cdkDropList
        [cdkDropListData]="localSelectedWords"
        class="example-list"
        (cdkDropListDropped)="drop($event)"
        cdkDropListOrientation="mixed"
        [cdkDropListDisabled]="state.disabled"
      >
        @for (word of localSelectedWords; track word.id){
        <div
          class="example-box"
          cdkDrag
          (click)="removeWord(word)"
          [class.disabled]="state.disabled"
          [style]="word.css"
        >
          {{ word.content }}
        </div>
        }
      </div>
    </div>
  </div>

  <div style="height: 20px"></div>

  <div nz-row nzJustify="center">
    <div nz-col [nzSpan]="24" [nzXs]="24" [nzSm]="12">
      <div
        cdkDropList
        [cdkDropListData]="localWords"
        class="example-list"
        (cdkDropListDropped)="drop($event)"
        cdkDropListOrientation="mixed"
        [cdkDropListDisabled]="state.disabled"
      >
        @for (word of localWords; track word.id){
        <div class="example-box" [class.disabled]="state.disabled" cdkDrag (click)="addWord(word)" [style]="word.css">
          {{ word.content }}
        </div>
        }
      </div>
    </div>
  </div>
</nz-card>
<wc-base [(state)]="state"></wc-base>
