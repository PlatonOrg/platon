@if (state.appearance === 'inline' && state.type === 'select') {
<select
  [(ngModel)]="state.selection"
  [ngStyle]="{ 'justify-items': state.width === 'auto' ? 'center' : 'start' }"
  style="width: 100%"
>
  @for(item of state.items; track $index) {
  <option value="{{ item }}">{{ item }}</option>
  }
</select>
} @else {
<mat-form-field appearance="fill">
  <mat-label>{{ state.placeholder }}</mat-label>
  <mat-select
    [(ngModel)]="state.selection"
    (ngModelChange)="state.isFilled = true"
    [disabled]="state.disabled"
    style="width: 100%"
  >
    @for (item of state.items; track item) {
    <mat-option [value]="item">
      {{ item }}
    </mat-option>
    }
  </mat-select>
  @if (state.hint) {
  <mat-hint>{{ state.hint }}</mat-hint>
  } @if (state.prefix) {
  <div class="prefix" matIconPrefix>
    <img [src]="state.prefix | icongr" alt="prefix" />
  </div>
  } @if (state.suffix) {
  <div class="suffix" matIconSuffix>
    <img [src]="state.suffix | icongr" alt="suffix" />
  </div>
  }
</mat-form-field>
}
<wc-base [(state)]="state"></wc-base>
