<nz-drawer
  *ngIf="visible"
  [nzClosable]="false"
  [nzVisible]="visible"
  nzPlacement="right"
  nzTitle="Notifications"
  [nzFooter]="footer"
  [nzBodyStyle]="{ padding: 0 }"
  (nzOnClose)="visible = !visible"
>
  <ng-container *nzDrawerContent>
    <notif-list [(notifications)]="notifications" [hasMore]="hasMore" (loadMore)="fetchMore?.()" (closed)="close()" />
  </ng-container>

  <ng-template #footer>
    @if(hasNotifications) {
    <footer @fade>
      @if(hasUnreads) {
      <button @fade nz-button nzType="primary" [nzLoading]="markingAllAsRead" (click)="markAllAsRead()">
        Tout marquer comme lu
      </button>
      }
      <button @fade nz-button nzType="primary" nzDanger [nzLoading]="deletingAll" (click)="deleteAll()">
        Tout supprimer
      </button>
    </footer>
    }
  </ng-template>
</nz-drawer>
