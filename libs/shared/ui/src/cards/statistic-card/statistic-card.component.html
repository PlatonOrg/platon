<div class="statistic-card" (click)="onCardClick()" [ngClass]="{ editable: edit }">
  @if (icon || matIcon || nzIcon) {
  <div [style.background-color]="ribbonColor" class="ribbon">
    <span>
      @if (icon) {
      <ng-container *ngTemplateOutlet="icon"></ng-container>
      } @if (matIcon) {
      <mat-icon class="ribbon-icon">{{ matIcon }}</mat-icon>
      } @if (nzIcon) {
      <span class="ribbon-icon" nz-icon [nzType]="nzIcon" nzTheme="outline"></span>
      }
    </span>
  </div>
  }
  <div class="value" [style.color]="valueColor">
    @if (!isEditing) {
    {{ value }} {{ valueSuffix }}
    } @if (isEditing) {
    <nz-input-number
      (keydown)="onKeydown($event)"
      nzId="input-edit-value"
      [(ngModel)]="value"
      nzMin="0"
      nzMax="100"
      (focusout)="onFocusOut()"
    />
    }
  </div>
  <div class="description">
    {{ description }} @if (tooltip) {
    <mat-icon [nz-tooltip]="tooltip">info_circle</mat-icon>
    }
  </div>
  <div>
    <ng-content></ng-content>
  </div>
</div>
