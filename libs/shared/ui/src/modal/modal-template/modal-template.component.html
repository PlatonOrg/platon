@if (visible) {
<nz-modal
  [(nzVisible)]="visible"
  [nzBodyStyle]="customBodyStyle"
  nzClassName="ui-modal-template"
  [nzWidth]="width ?? 520"
  [nzTitle]="title"
  [nzClosable]="closable"
  [nzMaskClosable]="maskClosable"
  nzMask
  nzCentered
  (nzOnOk)="close(true)"
  (nzOnCancel)="close()"
  [nzFooter]="footerRender"
>
  <ng-container *nzModalContent>
    @if (visible) {
    <ng-container *ngTemplateOutlet="templates.first"></ng-container>
    }
  </ng-container>
</nz-modal>
}

<ng-template #footerRender>
  <ng-container *ngTemplateOutlet="footer ?? (templates.length > 1 ? templates.last : noFooter)"></ng-container>
</ng-template>

<ng-template #noFooter />
