<button mat-button (click)="onTrigger()">
  <mat-icon>search</mat-icon>
</button>

<input
  #searchRef
  id="tuto-search-bar"
  type="search"
  [placeholder]="searchbar?.placeholder || ''"
  [formControl]="control"
  (keydown.enter)="onTrigger()"
  [nzAutocomplete]="autocomplete"
  (focus)="startFiltering(control.value)"
/>

@if (showFilterButton) {
<button id="tuto_filter_list" data-tutorial-target="filter-button" mat-button (click)="onFilter()">
  <mat-icon>filter_list</mat-icon>
</button>
}

<nz-autocomplete #autocomplete>
  @if (suggesting) {
  <nz-auto-option>
    <div style="display: flex; justify-content: center">
      <nz-spin nzSimple></nz-spin>
    </div>
  </nz-auto-option>
  } @else {
  <nz-auto-optgroup [nzLabel]="'SUGGESTIONS'">
    @for (suggestion of suggestions; track suggestion) {
    <nz-auto-option (selectionChange)="onSelect($event, suggestion)" [nzValue]="onComplete(suggestion)">
      @if (suggestionTemplate) {
      <ng-container *ngTemplateOutlet="suggestionTemplate; context: { $implicit: suggestion }"></ng-container>
      } @else {
      {{ suggestion }}
      }
    </nz-auto-option>
    } @if (!suggestions.length) {
    <nz-auto-option nzDisabled> Aucune suggestion </nz-auto-option>
    }
  </nz-auto-optgroup>
  }
</nz-autocomplete>
