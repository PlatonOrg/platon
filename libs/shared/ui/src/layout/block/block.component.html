<nz-skeleton [nzActive]="state === 'LOADING'" [nzLoading]="state === 'LOADING'">
  <section>
    <ng-content></ng-content>
  </section>
</nz-skeleton>
<nz-skeleton [nzActive]="state === 'LOADING'" [nzLoading]="state === 'LOADING'">
  <section>
    @switch (state) { @case ('READY') {
    <router-outlet />
    } @case ('SERVER_ERROR') {
    <ui-error-500 />
    } @case ('FORBIDDEN') {
    <ui-error-403 />
    } @case ('NOT_FOUND') {
    <ui-error-404 />
    } }
  </section>
</nz-skeleton>
