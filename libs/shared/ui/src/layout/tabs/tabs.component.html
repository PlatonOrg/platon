<nz-skeleton [nzActive]="state === 'LOADING'" [nzLoading]="state === 'LOADING'">
  <section>
    <ng-content></ng-content>
  </section>
</nz-skeleton>
@if (state === 'READY') {
<section>
  <nz-tabs [nzLinkExact]="false" nzSize="default" nzType="line" [nzSelectedIndex]="selectedTabIndex">
    @for (tab of tabs; track $index) {
    <nz-tab>
      <a *nzTabLink nz-tab-link [routerLink]="tab.link" [queryParams]="tab.linkParams">
        <ng-container *ngTemplateOutlet="tab.templateRef"></ng-container>
      </a>
    </nz-tab>
    }
  </nz-tabs>
</section>
}
<nz-skeleton [nzActive]="state === 'LOADING'" [nzLoading]="state === 'LOADING'">
  <section>
    @switch (state) { @case ('READY') {
    <router-outlet />
    } @case ('SERVER_ERROR') {
    <ui-error-500 />
    } @case ('FORBIDDEN') {
    <ui-error-403 />
    } @case ('NOT_FOUND') {
    <ui-error-404 />
    } }
  </section>
</nz-skeleton>
