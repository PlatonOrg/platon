<div
  class="ui-tag-list-container"
  cdkDropList
  [cdkDropListDisabled]="!editable"
  (cdkDropListDropped)="handleReorder($any($event))"
  [class.vertical]="vertical"
>
  @if (tags) { @for (tag of tags; track $index) { @if (editingIndex === $index) {
  <ui-tag-input
    [small]="small"
    [value]="tag"
    [multiline]="multiline"
    (edited)="edit.next({ index: $index, value: $event })"
    (finished)="editingIndex = -1"
  />
  } @else {
  <nz-tag
    cdkDrag
    class="ui-tag-list-item"
    [nzMode]="editable ? 'closeable' : 'default'"
    (nzOnClose)="onClose($event, $index)"
  >
    @if (multiline) {
    <div>{{ tag }}</div>
    } @else {
    <span> {{ tag }}</span>
    } @if (editable) {
    <span nz-icon nzType="edit" nzTheme="outline" (click)="editingIndex = $index"></span>
    } </nz-tag
  >} } }
</div>

@if (editable) { @if (!creating) {
<nz-tag class="ui-tag-list-add-btn" nzNoAnimation (click)="creating = true">
  <span nz-icon nzType="plus"></span>
  {{ addLabel }}
</nz-tag>
} @if (creating) {
<ui-tag-input
  [small]="small"
  [value]="value"
  [multiline]="multiline"
  (edited)="create.next($event)"
  (finished)="creating = false"
/>
} }
