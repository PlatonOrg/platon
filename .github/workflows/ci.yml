name: CI

on:
  pull_request:
    branches:
      - 'main'
      - 'develop'
  push:
    branches:
      - 'develop'
  workflow_dispatch:

jobs:
  prepare:
      name: Prepare
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - uses: ./.github/actions/yarn-setup

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - run: yarn affected:build --parallel --base=${{ env.NX_BASE }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - run: yarn affected:lint --parallel --base=${{ env.NX_BASE }}

      - name: No em or en dash
        run: yarn lint:em-dashes

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      # Jest transpiles without checking types (isolatedModules): the .spec.ts files are type-checked here
      - run: yarn affected:typecheck --parallel --base=${{ env.NX_BASE }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      # One project at a time, each with a Jest worker per core: the runner is fully used without more
      # workers than cores (the `ci` configuration of the Jest target sets the workers and the coverage)
      - run: yarn nx affected -t test --configuration=ci --parallel=1 --base=${{ env.NX_BASE }} && node coverage-merger.mjs

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Run integration tests on affected projects
        run: yarn affected:test:integration --base=${{ env.NX_BASE }}

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/yarn-setup

      - name: 'NX: SHAs for affected'
        uses: nrwl/nx-set-shas@v3
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Run e2e tests on affected projects
        run: yarn affected:test:e2e --base=${{ env.NX_BASE }}
