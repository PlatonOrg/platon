<div class="configure-page">
  @if (loading) {
  <div class="loading-container">
    <nz-spin nzSimple [nzSize]="'large'" nzTip="Chargement de la configuration..."></nz-spin>
  </div>
  } @if (error) {
  <nz-alert nzType="error" [nzMessage]="error" nzShowIcon [nzCloseable]="true" (nzOnClose)="goBack()"></nz-alert>
  } @if (!loading && !error && resource) {
  <mat-toolbar class="configure-toolbar">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="toolbar-title">Configuration : {{ resource.name }}</span>
    <span class="toolbar-spacer"></span>
    <button mat-raised-button color="accent" (click)="togglePreview()" [disabled]="saving">
      <mat-icon>{{ showPreview ? 'visibility_off' : 'visibility' }}</mat-icon>
      {{ showPreview ? "Masquer l'aperçu" : "Afficher l'aperçu" }}
    </button>
    <button mat-stroked-button (click)="openInEditor()" [disabled]="saving">
      <mat-icon>code</mat-icon>
      Mode avancé
    </button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="saving">
      <mat-icon>save</mat-icon>
      Sauvegarder
    </button>
  </mat-toolbar>

  <div class="configure-content" [class.split-view]="showPreview">
    <div class="configuration-panel">
      <mat-card>
        <mat-card-header>
          <mat-card-title>
            <mat-icon>settings</mat-icon>
            Paramètres de l'exercice
          </mat-card-title>
          <mat-card-subtitle> Template : {{ template?.name }} </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <div class="inputs-container">
            @for (input of inputs; track trackInput($index, input)) {
            <div class="input-wrapper">
              <app-ple-input [input]="input" [mode]="'plo'" [disabled]="saving" (inputChange)="onInputChange($event)" />
            </div>
            @if (!$last) {
            <mat-divider></mat-divider>
            } }
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    @if (showPreview) {
    <div class="preview-panel">
      <app-ui-iframe #previewIframe [src]="previewUrl" />
    </div>
    }
  </div>
  }
</div>
