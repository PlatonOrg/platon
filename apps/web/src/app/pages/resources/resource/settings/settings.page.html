@if (contextChange | async; as context) {
<nz-tabs [nzTabPosition]="isMobile ? 'top' : 'left'" nzLinkRouter>
  @if (context.resource) {
  <nz-tab>
    <a *nzTabLink nz-tab-link [routerLink]="['.']" [queryParams]="{ tab: 'informations' }" queryParamsHandling="merge">
      Informations
    </a>
    <app-resource-informations />
  </nz-tab>
  } @if (context.resource?.type === 'EXERCISE') {
  <nz-tab>
    <a *nzTabLink nz-tab-link [routerLink]="['.']" [queryParams]="{ tab: 'template' }" queryParamsHandling="merge">
      Template
    </a>
    <app-resource-template />
  </nz-tab>
  } @if (context.resource?.type === 'CIRCLE') {
  <nz-tab>
    <a *nzTabLink nz-tab-link [routerLink]="['.']" [queryParams]="{ tab: 'members' }" queryParamsHandling="merge">
      Collaborateurs
    </a>
    <app-resource-members />
  </nz-tab>
  }
</nz-tabs>
}
