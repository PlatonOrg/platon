<nz-form-item>
  <nz-form-label [nzSpan]="3" nzLabelAlign="left" for="language">Langage</nz-form-label>
  <nz-form-control>
    <nz-select
      id="language"
      nzShowSearch
      [disabled]="disabled"
      [(ngModel)]="options.language"
      (ngModelChange)="notifyOptionsChange?.(options)"
    >
      @for (language of languages; track language) {
      <nz-option [nzValue]="language.id" [nzLabel]="language.id"></nz-option>
      }
    </nz-select>
  </nz-form-control>
</nz-form-item>
