<nz-form-item nzRequired style="display: flex; flex-wrap: wrap; align-items: center">
  <nz-form-label nzLabelAlign="left" style="flex: 0 0 auto">Saisie multiligne</nz-form-label>
  <nz-form-control>
    <label
      nz-checkbox
      [(ngModel)]="options.multiline"
      (ngModelChange)="notifyOptionsChange?.(options)"
      [nzDisabled]="disabled"
    ></label>
  </nz-form-control>
</nz-form-item>
