<div class="page-header">
  <!-- Bouton retour au cours -->
  <button class="back-button" nz-button nzType="default" (click)="navigateToCourse()" *ngIf="context.course?.id">
    <i nz-icon nzType="arrow-left"></i>
    Retour au cours
  </button>

  <!-- Titre de la page -->
  <h1 class="page-title">Suivi de l'activité</h1>
</div>

@if (isOpen()) {
<!-- Message d'information -->
<div class="info-banner">
  <i class="info-icon" nz-icon nzType="info-circle"></i>
  <p class="info-text">
    <strong>Information :</strong> Cette page est en cours de construction. Certaines fonctionnalités peuvent être
    limitées.
  </p>
</div>

<ng-container *ngIf="context.results">
  <!-- Composant de modération des utilisateurs -->
  <div class="content-section">
    <course-activity-moderation
      [results]="context.results.users"
      (moderationAction)="onModerationAction($event)"
      [code]="context.activity?.code"
    />
  </div>

  <!-- Tableaux de résultats -->
  <div class="content-section">
    <result-by-members [results]="context.results.users" [columnOrder]="columnOrder" />
  </div>
</ng-container>
} @else {
<div class="info-banner">
  <i class="info-icon" nz-icon nzType="info-circle"></i>
  <p class="info-text"><strong>Information :</strong> L'activité doit être ouverte pour accéder au suivi.</p>
</div>
}
