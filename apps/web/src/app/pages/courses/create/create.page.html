<header>
  <nz-page-header [nzTitle]="header" nzBackIcon>
    <ng-template #header> Créer un cours </ng-template>
  </nz-page-header>
</header>
<main>
  <nz-skeleton [nzActive]="loading" [nzLoading]="loading">
    <ui-stepper #stepper (finished)="create()">
      <ng-template uiStepperStep stepTitle="Informations" stepIcon="info-circle" [stepValidator]="!!infos.valid">
        <section>
          <h4>Entrez les informations de base pour votre cours.</h4>
          <form [formGroup]="infos">
            <mat-form-field appearance="fill">
              <mat-label>Nom</mat-label>
              <input matInput formControlName="name" />
            </mat-form-field>
            <mat-form-field appearance="fill">
              <mat-label>Description</mat-label>
              <textarea cdkTextareaAutosize matInput formControlName="desc"></textarea>
            </mat-form-field>
          </form>
        </section>
      </ng-template>
      <ng-template uiStepperStep stepTitle="Format" stepIcon="layout" [stepValidator]="!!format.valid">
        <section [formGroup]="format">
          <h4>Choisissez le format de votre cours.</h4>
          <p class="format-warning">Ce choix ne pourra plus être modifié une fois le cours créé.</p>
          <div class="format-options">
            <button
              type="button"
              class="format-option"
              [class.selected]="format.value.format === CourseFormat.CLASSIC"
              (click)="format.controls.format.setValue(CourseFormat.CLASSIC)"
            >
              <h5>Cours classique</h5>
              <p>Une compilation d'activités (exercices, tests) organisées en sections.</p>
            </button>
            <button
              type="button"
              class="format-option"
              [class.selected]="format.value.format === CourseFormat.OPENCLASS"
              (click)="format.controls.format.setValue(CourseFormat.OPENCLASS)"
            >
              <h5>Cours OpenClass</h5>
              <p>Des leçons (contenu de cours) et des activités mélangées, consultées en lecture séquentielle.</p>
            </button>
          </div>
        </section>
      </ng-template>
    </ui-stepper>
  </nz-skeleton>
</main>
<footer>
  @if (creating) {
  <nz-spin nzTip="Création du cours..."></nz-spin>
  } @else { @if (!stepper.isFirst) {
  <button nz-button [disabled]="stepper.isFirst" (click)="stepper.prevStep()">Précedent</button>
  }
  <button
    nz-button
    nzType="primary"
    [disabled]="!stepper.isValid"
    (click)="infos.markAllAsTouched(); stepper.nextStep()"
  >
    {{ stepper.isLast ? 'Créer' : 'Suivant' }}
  </button>
  }
</footer>
